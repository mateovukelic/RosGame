# Publica el juego en GitHub Pages. Es un sitio estático sin build: se sube el
# repo tal cual. Para activarlo una sola vez:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Demo jugable

on:
  push:
    branches: [claude/political-management-roguelike-game-e89get, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No publicar nada roto
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
